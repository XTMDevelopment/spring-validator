name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test Java ${{ matrix.java }} / Boot ${{ matrix.spring-boot }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 25 ]
        spring-boot: [ '3.5.14', '4.0.5' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Run tests
        run: mvn clean test "-Dspring-boot.version=${{ matrix.spring-boot }}" "-Dgpg.skip=true"

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}-boot-${{ matrix.spring-boot }}
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: Quality gates (Java 17, Boot 3.5.14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: mvn clean verify "-Dspring-boot.version=3.5.14" "-Dgpg.skip=true"

      - name: Install artifacts for sample consumer
        run: mvn install -DskipTests "-Dspring-boot.version=3.5.14" "-Dgpg.skip=true"

      - name: Sample consumer smoke (Boot 3.5.14)
        run: mvn -f examples/spring-boot-starter-sample/pom.xml test "-Dspring-boot.version=3.5.14"

      - name: Sample consumer smoke (Boot 4.0.5)
        run: mvn -f examples/spring-boot-starter-sample/pom.xml test "-Dspring-boot.version=4.0.5"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-java-17
          path: target/site/jacoco-aggregate/
          retention-days: 7
          if-no-files-found: ignore
